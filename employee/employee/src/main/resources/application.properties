spring.application.name=employee
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management_system?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql: false
spring.jpa.properties.javax.persistence.schema-generation.database.action=update
server.port=8005
react-origin=http://localhost:5173


# Swagger Configuration - PORT 8005 SPECIFIC
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/api-docs
springdoc.swagger-ui.config-url=/api-docs/swagger-config

# Enable Swagger
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Customize Swagger UI
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none

# Try these if still having issues
springdoc.paths-to-match=/api/v1/**
springdoc.packages-to-scan=com.employee.controller
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json

# Disable cache for development
springdoc.cache.disabled=true